<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Websitechecks</title>
<style>
@font-face { font-family: 'PJS'; src: url(assets/plusjakartasans-latin-var.woff2) format('woff2'); font-weight: 200 800; font-display: swap; }
:root { --ink: #0B1020; --muted: #636A80; --line: #E4E7EE; --soft: #F3F5F9; --bg: #FFFFFF; --cobalt: #3346D3; --cobalt-soft: #E9ECFD; --navy: #0D074F;
  --goed: #2F6B40; --goed-bg: #E6F2E9; --beter: #7A5A00; --beter-bg: #FBF0D6; --actie: #9A3322; --actie-bg: #F9E1DC; --card: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #EEF0F6; --muted: #9AA1B5; --line: #262B3B; --soft: #151927; --bg: #0B0E18; --card: #121624; --cobalt-soft: #1C2350; } }
:root[data-theme="dark"] { --ink: #EEF0F6; --muted: #9AA1B5; --line: #262B3B; --soft: #151927; --bg: #0B0E18; --card: #121624; --cobalt-soft: #1C2350; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'PJS', system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
.verborgen { display: none !important; }
.lg-d { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lg-l { display: none; } :root:not([data-theme="light"]) .lg-d { display: inline; } }
:root[data-theme="dark"] .lg-l { display: none; } :root[data-theme="dark"] .lg-d { display: inline; }
button { font: inherit; cursor: pointer; }
/* inloggen */
#login { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(600px 400px at 80% 0%, var(--cobalt-soft), transparent 60%), var(--bg); }
.lbox { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 32px 28px; text-align: center; box-shadow: 0 30px 60px -40px rgba(11,16,32,.45); }
.lbox img { height: 26px; margin-bottom: 18px; }
.lbox h1 { font-size: 22px; letter-spacing: -.02em; margin-bottom: 6px; }
.lbox p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.lbox input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); font: inherit; font-size: 16px; }
.lbox button { width: 100%; margin-top: 10px; padding: 13px; border-radius: 999px; border: 0; background: var(--ink); color: var(--bg); font-weight: 600; }
.fout { color: var(--actie); font-size: 13px; min-height: 20px; margin-top: 10px; }
.slot { font-size: 12px; color: var(--muted); margin-top: 14px; }
/* app */
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hin { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 14px; }
.hin img { height: 20px; }
.hin h1 { font-size: 16px; letter-spacing: -.01em; }
.hin .upd { margin-left: auto; color: var(--muted); font-size: 12px; }
.ib { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 12px; font-size: 13px; }
main { max-width: 1100px; margin: 0 auto; padding: 22px 16px 60px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
.kpi { background: var(--soft); border-radius: 16px; padding: 14px 16px; }
.kpi b { display: block; font-size: 24px; letter-spacing: -.02em; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 999px; font-size: 13.5px; }
.seg button.aan { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(11,16,32,.12); }
.zoek { flex: 1; min-width: 180px; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 14px; }
.leeg { text-align: center; color: var(--muted); padding: 60px 16px; border: 1px dashed var(--line); border-radius: 18px; }
.kaart { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; margin-bottom: 10px; cursor: pointer; transition: border-color .2s, transform .2s; }
.kaart:hover { border-color: var(--cobalt); transform: translateY(-1px); }
.ring { width: 64px; height: 64px; }
.kt { min-width: 0; }
.kt h3 { font-size: 16px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 2px 0 6px; }
.bron { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em; }
.bron.go4it { background: var(--cobalt-soft); color: var(--cobalt); }
.bron.ais { background: #E8E6F5; color: var(--navy); }
.tops { font-size: 13px; color: var(--ink); display: grid; gap: 2px; }
.tops span::before { content: '•'; color: var(--muted); margin-right: 6px; }
.knoppen { display: flex; flex-direction: column; gap: 6px; }
.knop { border: 0; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; background: var(--ink); color: var(--bg); white-space: nowrap; text-decoration: none; text-align: center; }
.knop.licht { background: var(--soft); color: var(--ink); }
/* detail */
#detail { position: fixed; inset: 0; z-index: 10; background: rgba(11,16,32,.45); display: flex; justify-content: flex-end; }
.paneel { width: min(620px, 100%); height: 100%; overflow-y: auto; background: var(--bg); padding: 22px 22px 60px; }
.pk { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.pk h2 { font-size: 20px; letter-spacing: -.02em; }
.sluit { margin-left: auto; }
.blok { background: var(--soft); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.blok h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
.rij { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.rij:first-of-type { border-top: 0; }
.rij small { display: block; color: var(--muted); font-size: 12.5px; }
.pil { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; align-self: center; }
.pil.goed { background: var(--goed-bg); color: var(--goed); } .pil.beter { background: var(--beter-bg); color: var(--beter); }
.pil.actie { background: var(--actie-bg); color: var(--actie); } .pil.nakijken { background: var(--card); color: var(--muted); }
.gegevens { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 14px; }
.gegevens dt { color: var(--muted); } .gegevens a { color: var(--cobalt); }
pre.mail { white-space: pre-wrap; font: inherit; font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; max-height: 360px; overflow: auto; }
.rk { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
@media (max-width: 640px) {
  .hin { gap: 10px; } .hin .upd { display: none; } .hin img { height: 16px; } .hin h1 { font-size: 15px; } .ib { margin-left: auto; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kaart { grid-template-columns: 52px minmax(0, 1fr); }
  .ring { width: 52px; height: 52px; }
  .knoppen { grid-column: 1 / -1; flex-direction: row; }
  .knoppen .knop { flex: 1; }
}
</style>
</head>
<body>
<div id="login"><form class="lbox" id="lform">
  <img class="lg-l" src="assets/go4it-logo.svg" alt="GO 4IT-Studio"><img class="lg-d" src="assets/go4it-logo-licht.svg" alt="GO 4IT-Studio">
  <h1>Websitechecks</h1>
  <p>Alle aanvragen van go4itstudio.com en ais-groep.nl, met rapport en conceptmail.</p>
  <label class="verborgen" for="pw">Wachtwoord</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Wachtwoord" required>
  <button type="submit">Openen</button>
  <div class="fout" id="lfout" role="alert"></div>
  <div class="slot">🔒 Versleuteld · AES-256-GCM · alleen te openen met je wachtwoord</div>
</form></div>

<div id="app" class="verborgen">
  <header><div class="hin"><img class="lg-l" src="assets/go4it-logo.svg" alt="GO 4IT-Studio"><img class="lg-d" src="assets/go4it-logo-licht.svg" alt="GO 4IT-Studio"><h1>Websitechecks</h1><span class="upd" id="upd"></span><button class="ib" id="uit">Uitloggen</button></div></header>
  <main>
    <div class="kpis" id="kpis"></div>
    <div class="tools">
      <div class="seg" id="fbron"><button data-v="alle" class="aan">Alle</button><button data-v="go4it">GO 4IT</button><button data-v="ais">AIS</button></div>
      <input class="zoek" id="q" type="search" placeholder="Zoek op bedrijf, naam of website" aria-label="Zoeken">
    </div>
    <div id="lijst"></div>
  </main>
</div>

<div id="detail" class="verborgen" role="dialog" aria-modal="true"><div class="paneel" id="paneel"></div></div>

<script>
(function () {
  var sleutelPw = null, data = [], filter = 'alle';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var b64 = function (s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };

  async function ontsleutel(enc, pw) {
    var basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(enc.salt), iterations: enc.iter, hash: 'SHA-256' }, basis, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var platte = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(enc.iv) }, key, b64(enc.ct));
    return JSON.parse(new TextDecoder().decode(platte));
  }
  async function haal(pad) {
    var r = await fetch(pad + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status === 404 ? 'leeg' : 'fout');
    return r.json();
  }
  function kleur(c) { return c >= 8 ? ['#0C8A4A', '#E3F6EA'] : c >= 5.5 ? ['#C26A00', '#FFF1DC'] : ['#C9362B', '#FDE4E1']; }
  function ring(c) {
    var k = kleur(c), om = 2 * Math.PI * 26, d = om * c / 10;
    return '<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="' + k[1] + '" stroke="' + k[1] + '" stroke-width="7"/>' +
      '<circle cx="32" cy="32" r="26" fill="none" stroke="' + k[0] + '" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + d.toFixed(1) + ' ' + om.toFixed(1) + '" transform="rotate(-90 32 32)"/>' +
      '<text x="32" y="38" text-anchor="middle" font-size="17" font-weight="800" fill="' + k[0] + '" font-family="PJS, system-ui">' + String(c).replace('.', ',') + '</text></svg>';
  }
  var LABEL = { goed: 'Goed', beter: 'Kan beter', actie: 'Actie nodig', nakijken: 'Niet bekeken' };

  function toon() {
    var q = $('q').value.toLowerCase().trim();
    var rijen = data.filter(function (c) {
      if (filter !== 'alle' && c.bron !== filter) return false;
      return !q || [c.bedrijf, c.naam, c.host, c.mail].join(' ').toLowerCase().indexOf(q) !== -1;
    });
    var week = Date.now() - 7 * 864e5;
    var gem = data.length ? (data.reduce(function (s, c) { return s + (c.cijfer || 0); }, 0) / data.length) : 0;
    $('kpis').innerHTML = [[data.length, 'aanvragen in totaal'], [data.filter(function (c) { return new Date(c.datum.replace(' ', 'T')) > week; }).length, 'deze week'],
      [data.length ? gem.toFixed(1).replace('.', ',') : '–', 'gemiddeld cijfer'], [data.filter(function (c) { return c.bron === 'go4it'; }).length + ' / ' + data.filter(function (c) { return c.bron === 'ais'; }).length, 'GO 4IT / AIS']]
      .map(function (k) { return '<div class="kpi"><b>' + k[0] + '</b><span>' + k[1] + '</span></div>'; }).join('');
    if (!rijen.length) { $('lijst').innerHTML = '<div class="leeg">' + (data.length ? 'Niets gevonden met dit filter.' : 'Nog geen websitechecks. Zodra er een aanvraag binnenkomt, staat hij hier.') + '</div>'; return; }
    $('lijst').innerHTML = rijen.map(function (c) {
      return '<article class="kaart" data-id="' + esc(c.id) + '">' + ring(c.cijfer) +
        '<div class="kt"><h3>' + esc(c.bedrijf || c.host) + '</h3><div class="meta"><span class="bron ' + c.bron + '">' + (c.bron === 'ais' ? 'AIS-Groep' : 'GO 4IT') + '</span>' +
        '<span>' + esc(c.datum) + '</span><span>' + esc(c.host) + '</span>' + (c.naam ? '<span>' + esc(c.naam) + '</span>' : '') + '</div>' +
        '<div class="tops">' + (c.top || []).map(function (t) { return '<span>' + esc(t.kort) + '</span>'; }).join('') + '</div></div>' +
        '<div class="knoppen"><button class="knop" data-pdf="' + esc(c.id) + '">Rapport</button><button class="knop licht" data-open="' + esc(c.id) + '">Details</button></div></article>';
    }).join('');
  }

  async function laadItem(id) { return ontsleutel(await haal('data/' + id + '.enc'), sleutelPw); }
  async function openPdf(id) {
    var it = await laadItem(id);
    var blob = new Blob([b64(it.pdf)], { type: 'application/pdf' }), url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.download = 'websitecheck-' + (it.samenvatting.host || id) + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
  }
  async function openDetail(id) {
    var c = data.find(function (x) { return x.id === id; });
    $('paneel').innerHTML = '<p>Openen…</p>'; $('detail').classList.remove('verborgen');
    var it = await laadItem(id), s = it.samenvatting, cm = s.conceptmail || {};
    var naar = s.mail || '';
    var mailto = naar ? 'mailto:' + encodeURIComponent(naar) + '?subject=' + encodeURIComponent(cm.onderwerp || '') + '&body=' + encodeURIComponent(cm.tekst || '') : '';
    var psi = s.psi || {}, ps = '';
    ['mobiel', 'computer'].forEach(function (k) { var d = psi[k]; if (d) ps += '<div class="rij"><span>PageSpeed ' + (k === 'mobiel' ? 'telefoon' : 'computer') + '</span><span>prestaties ' + d.score + ' · SEO ' + d.seo + '</span></div>'; });
    $('paneel').innerHTML = '<div class="pk">' + ring(s.cijfer) + '<div><h2>' + esc(s.bedrijf || s.host) + '</h2><div class="meta"><span class="bron ' + s.bron + '">' + (s.bron === 'ais' ? 'AIS-Groep' : 'GO 4IT') + '</span><span>' + esc(s.datum) + '</span></div></div><button class="ib sluit" id="sluit">Sluiten</button></div>' +
      '<div class="blok"><h4>Aanvrager</h4><dl class="gegevens"><dt>Naam</dt><dd>' + esc(s.naam || '–') + '</dd><dt>E-mail</dt><dd>' + (s.mail ? '<a href="mailto:' + esc(s.mail) + '">' + esc(s.mail) + '</a>' : '–') + '</dd>' +
      '<dt>Telefoon</dt><dd>' + (s.telefoon ? '<a href="tel:' + esc(s.telefoon) + '">' + esc(s.telefoon) + '</a>' : '–') + '</dd><dt>Website</dt><dd><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.host) + '</a></dd>' +
      (s.vraag ? '<dt>Vraag</dt><dd>' + esc(s.vraag) + '</dd>' : '') + (s.klant_ais ? '<dt>Klant AIS</dt><dd>' + esc(s.klant_ais) + '</dd>' : '') + '</dl></div>' +
      '<div class="blok"><h4>Uitkomst</h4>' + (s.onderdelen || []).map(function (o) { return '<div class="rij"><div>' + esc(o.titel) + '<small>' + esc(o.kort) + '</small></div><span class="pil ' + o.status + '">' + LABEL[o.status] + '</span></div>'; }).join('') + ps + '</div>' +
      '<div class="blok"><h4>Conceptmail aan de klant</h4><pre class="mail" id="cmail">Onderwerp: ' + esc(cm.onderwerp) + '\n\n' + esc(cm.tekst) + '</pre>' +
      '<div class="rk"><button class="knop" id="kopie">Kopieer tekst</button>' + (mailto ? '<a class="knop licht" href="' + mailto + '">Open in Mail</a>' : '') + '<button class="knop licht" data-pdf="' + esc(id) + '">Rapport (PDF)</button></div>' +
      '<p class="slot" style="text-align:left">Lees het rapport even na, zet de PDF als bijlage bij de mail en verstuur hem zelf.</p></div>';
    $('sluit').onclick = function () { $('detail').classList.add('verborgen'); };
    $('kopie').onclick = function () { navigator.clipboard.writeText($('cmail').textContent).then(function () { $('kopie').textContent = 'Gekopieerd'; }); };
  }

  $('lform').addEventListener('submit', async function (e) {
    e.preventDefault(); $('lfout').textContent = 'Openen…';
    var pw = $('pw').value;
    try {
      var lijst;
      try { lijst = await ontsleutel(await haal('data/lijst.enc'), pw); }
      catch (err) { if (err.message === 'leeg') { lijst = { checks: [], bijgewerkt: null }; } else { throw err; } }
      sleutelPw = pw; data = lijst.checks || [];
      $('upd').textContent = lijst.bijgewerkt ? 'Bijgewerkt ' + new Date(lijst.bijgewerkt).toLocaleString('nl-NL', { dateStyle: 'medium', timeStyle: 'short' }) : '';
      $('login').classList.add('verborgen'); $('app').classList.remove('verborgen'); $('pw').value = ''; toon();
    } catch (err) { $('lfout').textContent = 'Dat wachtwoord klopt niet.'; }
  });
  $('uit').onclick = function () { sleutelPw = null; data = []; $('app').classList.add('verborgen'); $('login').classList.remove('verborgen'); $('lijst').innerHTML = ''; $('lfout').textContent = ''; };
  $('q').addEventListener('input', toon);
  $('fbron').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; filter = b.dataset.v; this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('aan', x === b); }); toon(); });
  document.addEventListener('click', function (e) {
    var p = e.target.closest('[data-pdf]'); if (p) { e.stopPropagation(); openPdf(p.dataset.pdf); return; }
    var o = e.target.closest('[data-open], .kaart'); if (o && !e.target.closest('#paneel')) { openDetail(o.dataset.open || o.dataset.id); }
  });
  $('detail').addEventListener('click', function (e) { if (e.target === this) this.classList.add('verborgen'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('detail').classList.add('verborgen'); });
})();
</script>
</body>
</html>
